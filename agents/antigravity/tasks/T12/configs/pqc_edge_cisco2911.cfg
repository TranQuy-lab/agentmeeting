! ==============================================================================
! Cisco 2911 Integrated Services Router Configuration
! Testbed: RL-T1-PQC-TLS (Edge PQC TLS Handshake & Middlebox MTU Clamping)
! Generated for Cisco Packet Tracer / Production IOS Deployment
! ==============================================================================
version 15.1
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Edge-PQC-Router
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
!
! NetFlow export for TLS handshake flow analysis
flow record PQC_FLOW_RECORD
 match ipv4 protocol
 match ipv4 source address
 match ipv4 destination address
 match transport source-port
 match transport destination-port
 collect counter bytes long
 collect counter packets long
 collect timestamp sys-uptime first
 collect timestamp sys-uptime last
!
flow exporter PQC_EXPORTER
 destination 10.10.10.50
 transport udp 2055
!
flow monitor PQC_MONITOR
 record PQC_FLOW_RECORD
 exporter PQC_EXPORTER
 cache timeout active 60
!
! Interface facing Edge Clients (VLAN 10 / Ingress)
interface GigabitEthernet0/0
 description Link to Edge Client Segment
 ip address 10.10.10.1 255.255.255.0
 ip flow monitor PQC_MONITOR input
 ip flow monitor PQC_MONITOR output
 duplex auto
 speed auto
 no shutdown
!
! Interface facing Middlebox / Origin TLS Server (Egress with MTU Clamping)
interface GigabitEthernet0/1
 description Link to PQC Origin Server via Netem/Middlebox
 ip address 172.16.1.1 255.255.255.0
 ! MTU Clamping parameter for Post-Quantum TLS 1.3 ClientHello (RFC 9954)
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip flow monitor PQC_MONITOR input
 ip flow monitor PQC_MONITOR output
 duplex auto
 speed auto
 no shutdown
!
! Access Control List for PQC TLS Traffic (TCP 4433)
ip access-list extended ACL_PQC_TRAFFIC
 permit tcp any any eq 4433
 permit tcp any eq 4433 any established
 permit icmp any any echo
 permit icmp any any echo-reply
 permit icmp any any unreachable
 deny ip any any log
!
interface GigabitEthernet0/0
 ip access-group ACL_PQC_TRAFFIC in
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 172.16.1.254
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input ssh
!
end
