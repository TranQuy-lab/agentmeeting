! ==============================================================================
! Cisco ASA 5506-X Adaptive Security Appliance Configuration
! Testbed: RL-T1-PQC-TLS (Middlebox Firewall & Controlled PMTUD Blackhole)
! ==============================================================================
ASA Version 9.6(1)
!
hostname Edge-PQC-ASA
names
!
interface GigabitEthernet1/1
 nameif inside
 security-level 100
 ip address 10.10.10.254 255.255.255.0
 no shutdown
!
interface GigabitEthernet1/2
 nameif dmz-pqc
 security-level 50
 ip address 172.16.1.254 255.255.255.0
 no shutdown
!
! Policy Map & Inspection for TLS Handshake
class-map CM_PQC_TLS
 match port tcp eq 4433
!
policy-map PM_PQC_INSPECT
 class CM_PQC_TLS
  inspect tls
!
service-policy PM_PQC_INSPECT interface inside
!
! Access List: Drop ICMP Fragmentation Needed to simulate PMTUD Blackhole (DROP_ICMP_FRAG=1)
access-list ACL_IN_OUT extended permit tcp any host 172.16.1.100 eq 4433
access-list ACL_IN_OUT extended permit icmp any any echo
access-list ACL_IN_OUT extended deny icmp any any unreachable
!
access-group ACL_IN_OUT in interface inside
!
mtu inside 1500
mtu dmz-pqc 1400
!
end
