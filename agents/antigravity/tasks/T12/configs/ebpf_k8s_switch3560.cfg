! ==============================================================================
! Cisco Catalyst 3560 Layer 3 Switch Configuration
! Testbed: RL-T2-EBPF-SEG (K8s Cluster Microsegmentation & VACL Zero-Trust)
! ==============================================================================
version 12.2
no service password-encryption
!
hostname K8s-Core-Switch
!
ip routing
!
! VLAN definitions for K8s Microsegmentation Tiers
vlan 10
 name K8s-Frontend-Pods
!
vlan 20
 name K8s-Backend-Services
!
vlan 30
 name K8s-Database-Tier
!
! SVI Interfaces
interface Vlan10
 description Gateway for Frontend Pods
 ip address 10.244.10.1 255.255.255.0
!
interface Vlan20
 description Gateway for Backend Pods
 ip address 10.244.20.1 255.255.255.0
!
interface Vlan30
 description Gateway for Database Pods
 ip address 10.244.30.1 255.255.255.0
!
! VACL / VLAN Access Map for Zero-Trust Microsegmentation
! Only allow Frontend to Backend on port 8080/443; Deny direct Frontend to Database (VLAN 30)
ip access-list extended ACL_FE_TO_BE
 permit tcp 10.244.10.0 0.0.0.255 10.244.20.0 0.0.0.255 eq 8080
 permit tcp 10.244.10.0 0.0.0.255 10.244.20.0 0.0.0.255 eq 443
 permit icmp any any
!
ip access-list extended ACL_DENY_FE_TO_DB
 deny ip 10.244.10.0 0.0.0.255 10.244.30.0 0.0.0.255
 permit ip any any
!
vlan access-map VACL_ZERO_TRUST 10
 match ip address ACL_DENY_FE_TO_DB
 action forward
!
vlan filter VACL_ZERO_TRUST vlan-list 10,20,30
!
! Access Ports
interface FastEthernet0/1
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
!
interface FastEthernet0/2
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
!
interface FastEthernet0/3
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast
!
end
